name: Studio Prism native Android smoke

on:
  push:
    branches: [qa/studio-prism-device-smoke]
    paths: ['.github/workflows/android-ui-smoke.yml']

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Enable KVM access
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Boot emulator, exercise screens and capture
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            set -e
            cd android
            ./gradlew --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2160
            adb shell wm density 420
            adb shell am start -n br.com.agv.touch.dev/br.com.agv.touch.MainActivity
            sleep 5
            mkdir -p ../native-artifacts
            adb exec-out screencap -p > ../native-artifacts/01-home.png
            adb shell uiautomator dump /sdcard/tv-touch-screen.xml > /dev/null
            adb pull /sdcard/tv-touch-screen.xml ../native-artifacts/01-home.xml > /dev/null
            python3 - <<'PY'
            import re,subprocess,xml.etree.ElementTree as ET,time,pathlib
            def tap(text):
                subprocess.run(['adb','shell','uiautomator','dump','/sdcard/tv-touch-screen.xml'],check=True,stdout=subprocess.DEVNULL)
                subprocess.run(['adb','pull','/sdcard/tv-touch-screen.xml','../native-artifacts/current.xml'],check=True,stdout=subprocess.DEVNULL)
                root=ET.parse('../native-artifacts/current.xml')
                for node in root.iter('node'):
                    label=node.get('text','')+' '+node.get('content-desc','')
                    if text.lower() in label.lower():
                        match=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',node.get('bounds',''))
                        if not match: continue
                        x1,y1,x2,y2=map(int,match.groups())
                        subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
                        time.sleep(3)
                        return
                raise RuntimeError('Native control not found: '+text)
            tap('Criar agora')
            subprocess.run('adb exec-out screencap -p > ../native-artifacts/02-builder.png',shell=True,check=True)
            subprocess.run(['adb','shell','input','keyevent','4'],check=True)
            time.sleep(2)
            tap('Biblioteca')
            subprocess.run('adb exec-out screencap -p > ../native-artifacts/03-library.png',shell=True,check=True)
            print('TV Touch Studio Prism native UI smoke: home, builder, library OK')
            PY
            adb logcat -d -s AndroidRuntime:E > ../native-artifacts/androidruntime.log
            if grep -q 'FATAL EXCEPTION' ../native-artifacts/androidruntime.log; then
              echo 'Application crash detected'
              exit 1
            fi
      - name: Upload native screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-prism-native-ui
          path: native-artifacts/
          if-no-files-found: warn
          retention-days: 7
