name: Android MVP

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'public/js/voxel-world.js'
      - 'tests/fixtures/voxel-contract.json'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'public/js/voxel-world.js'
      - 'tests/fixtures/voxel-contract.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/build.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - name: Check voxel contract fixture
        working-directory: .
        run: |
          node android/tests/generate-voxel-contract.cjs
          git diff --exit-code -- tests/fixtures/voxel-contract.json
      - name: Test Android domain contract and storage
        working-directory: .
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tv-touch-domain-deps"
          export TV_TOUCH_JSON_JAR="$RUNNER_TEMP/tv-touch-domain-deps/json-20240303.jar"
          curl --fail --location --silent --show-error \
            'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar' \
            --output "$TV_TOUCH_JSON_JAR"
          printf '%s  %s\n' \
            '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed' \
            "$TV_TOUCH_JSON_JAR" | sha256sum --check -
          export TV_TOUCH_ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          bash android/tests/run-core-tests.sh
      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify development APK
        run: python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Save development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agv-touch-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-${{ github.run_number }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
