name: AGV TOUCH | Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, app/studio-0.2-premium]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agv-touch-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all tests
        run: node --test tests/*.test.cjs
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check public/service-worker.js
      - name: Check deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/arcade.html
          test -s public/oficina.html
          test -s public/css/agv-design-system.css
          test -s public/js/agv-touch-feedback.js

  browser:
    name: Chrome mobile and desktop smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify Chrome installation
        run: google-chrome --version
      - name: Exercise real browser and capture screens
        run: node tests/browser-smoke.mjs
      - name: Validate app prototype in Chrome
        env:
          BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
          TV_TOUCH_PROTOTYPE_OUTPUT: browser-artifacts/prototype
        run: node docs/app-design/verify-prototype.cjs
      - name: Validate Studio Prism responsive prototype in Chrome
        env:
          BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
          TV_TOUCH_PRISM_OUTPUT: browser-artifacts/prism
        run: node docs/app-design/verify-prism.cjs
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agv-touch-studio-3-2-browser-artifacts
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 7
