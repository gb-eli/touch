name: Studio Prism design pack

on:
  push:
    branches: [app/studio-0.2-premium]
    paths: ['.github/workflows/studio-prism-pack.yml']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify design sources
        run: |
          test -s docs/android/STUDIO_0.2_PRODUCT_PLAN.md
          test -s docs/app-design/03-studio-prism-high-fidelity.html
          test -s docs/app-design/verify-prism.cjs
      - name: Upload preview and blueprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tv-touch-studio-prism-0-2-design
          path: |
            docs/android/STUDIO_0.2_PRODUCT_PLAN.md
            docs/app-design/03-studio-prism-high-fidelity.html
            docs/app-design/verify-prism.cjs
          retention-days: 30
