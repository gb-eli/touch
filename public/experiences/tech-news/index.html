const sparkArt=`<svg viewBox="0 0 440 260" width="100%" role="img" aria-label="Esquema dimensional, não fotografia"><path d="M80 92L260 37L370 108L190 163Z" fill="#c6ad76" stroke="#f2e4c4"/><path d="M80 92V160L190 233V163Z" fill="#756443"/><path d="M190 163L370 108V176L190 233Z" fill="#a48d5f"/><path d="M75 74L255 19M75 66V82M255 11V27" stroke="#fff" stroke-width="2"/><text x="160" y="45" fill="#fff" font-size="20">150 mm</text><text x="200" y="252" fill="#fff" font-size="16">Esquema dimensional</text></svg>`;
const video=(id,label)=>`<div class="video" data-video="${id}" data-label="${esc(label)}"><button class="play" type="button">▶ Reproduzir vídeo</button></div><div class="video-text"><span>Legendas em português, se disponíveis.</span><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Abrir no YouTube ↗</a></div>`;
const slide=(name,topic,body,note,links=[],extra='')=>({name,topic,body,note,links,extra});
const slides=[
slide('Capa','',`<div class="cover-grid"><div><div class="year">NOVEMBRO 2026 / AGENDA 2027</div><h1>TECH<br>NEWS<span style="color:var(--accent)">.</span></h1><div class="line"></div><p class="issue">Hardware · IA · espaço · robótica · quântica</p><p class="small" style="margin-top:30px">Desenvolvimento de Sistemas / AGV</p></div><div class="art">${chip}</div></div>`,`Aula única para 1DS, 2DS e 3DS. Pergunte: qual dessas tecnologias vocês acompanham? Use o índice para selecionar cenas; não é necessário passar todas. Consulta de fontes: 26/11/2026.`,[],'cover'),
slide('DGX Spark','01 / Hardware',`<div class="split wide"><div><h2>Um computador de IA de</h2><div class="big" style="margin-top:20px">15 cm.</div><p class="sub">NVIDIA DGX Spark</p></div>${photo('spark','NVIDIA DGX Spark em vista de produto',sparkArt)}</div>`,`O chassi tem 150 × 150 × 50,5 mm. O Spark foi projetado para trabalho local com IA, não como substituto universal de um supercomputador científico. A imagem é de um varejista; o esquema alternativo não é fotografia.`,[S.spark,S.sparkDoc,media.spark[2]]),
slide('Especificações do Spark','01 / Hardware',`<h2>O que cabe nessa caixa?</h2><div class="split"><div><div class="big">128 GB</div><p class="sub">Memória unificada (configuração de referência)</p></div><div><div class="big">1 PFLOP</div><p class="sub">Pico de IA em FP4, com esparsidade</p></div></div><p class="small">GB10 Grace Blackwell · 150 × 150 × 50,5 mm</p>`,`1 PFLOP = 10¹⁵ operações de ponto flutuante por segundo no formato e condições especificados. FP4 é baixa precisão; não equivale a FP64 científico ou FPS em jogos. Memória unificada é compartilhada pelo sistema, não VRAM dedicada de 128 GB.`,[S.spark,S.sparkDoc]),
slide('Vídeo NVIDIA','01 / Vídeo',`<h2 style="font-size:49px">DGX Spark, em funcionamento</h2>${video('kZRMshaNrSA','NVIDIA DGX Spark — apresentação oficial')}`,`Vídeo localizado no YouTube. Não foi possível testar a permissão de incorporação, duração ou trilhas de áudio/legenda no ambiente atual. Assista a um trecho de aproximadamente 60–90 segundos selecionado pelo professor; pause manualmente. Se falhar, pule para a próxima cena.`,['https://www.youtube.com/watch?v=kZRMshaNrSA',S.spark]),
slide('RTX: três gerações','01 / Hardware',`<div class="split"><div><h2>RTX 3090.<br>RTX 4090.<br>RTX 5090.</h2><p class="sub">Três gerações, três arquiteturas.</p></div>${photo('gpu','Placa NVIDIA GeForce RTX 5090 Founders Edition')}</div>`,`Ampere, Ada Lovelace e Blackwell. Peça aos alunos que identifiquem o que mudou em memória e unidades de processamento. A imagem mostra apenas a RTX 5090, não as três.`,[S.g3090,S.g4090,S.g5090,media.gpu[2]]),
slide('Comparador de GPUs','01 / Hardware',`<h2>O que mudou?</h2><table class="table"><thead><tr><th>Modelo</th><th>3090</th><th>4090</th><th>5090</th></tr></thead><tbody><tr><td>CUDA cores</td><td>10.496</td><td>16.384</td><td><strong>21.760</strong></td></tr><tr><td>VRAM</td><td>24 GB</td><td>24 GB</td><td><strong>32 GB</strong></td></tr><tr><td>Tipo</td><td>GDDR6X</td><td>GDDR6X</td><td>GDDR7</td></tr></tbody></table><p class="sub">Mais núcleos não significa o mesmo aumento de FPS.</p>`,`Dados das fichas oficiais. Diferentes arquiteturas, clocks, memória, software e configurações influenciam desempenho. Não usar proporção de CUDA cores como benchmark.`,[S.g3090,S.g4090,S.g5090]),
slide('CPU × GPU','01 / Experimento',`<h2>Divida o trabalho.</h2><div class="split"><div><div class="metric"><span>CPU (8 unidades)</span><b id="cpuCycles">8</b></div><div class="gridcpu" id="cpuGrid"></div><div class="metric"><span>GPU (64 unidades)</span><b id="gpuCycles">1</b></div><div class="gridcpu" id="gpuGrid"></div><p class="small">Rodadas de tarefas independentes</p></div><div><div class="big" id="tasksValue">64</div><p class="sub">tarefas</p><div class="ctrl"><input id="tasks" type="range" min="8" max="256" step="8" value="64" aria-label="Quantidade de tarefas"></div><p class="captioned">Modelo didático, não benchmark.</p></div></div>`,`Simulação idealizada: cada unidade faz uma tarefa por rodada, com custos iguais. GPU real não tem apenas 64 unidades e CPU/GPU não possuem unidades equivalentes. A demonstração explica paralelismo, não velocidade real.`,[]),
slide('IA na máquina ou na nuvem','02 / IA',`<h2>Onde a IA está rodando?</h2><div class="split"><div style="border-top:4px solid var(--accent);padding-top:30px"><div class="num">Local</div><p class="sub">O modelo roda no seu equipamento.</p><p class="captioned">Memória e processamento próprios.</p></div><div style="border-top:4px solid #a8aaa5;padding-top:30px"><div class="num">Nuvem</div><p class="sub">O modelo roda em servidores remotos.</p><p class="captioned">Acesso por rede.</p></div></div>`,`Compare privacidade, latência, custo de equipamento e dependência de internet. Execução local não garante privacidade se o software ainda enviar dados. Modelos maiores podem não caber na memória.`,[S.spark]),
slide('Novidades de IA em novembro','02 / IA',`<h2>IA que escreve e testa código.</h2><div class="split"><div><div class="eyebrow">OpenAI · novembro 2026</div><div class="num" style="font-size:71px">GPT-6.2</div><p class="sub">Astra e Sol</p></div><div><div class="eyebrow">Google · novembro 2026</div><div class="num" style="font-size:71px">Gemini 4</div><p class="sub">Neon</p></div></div><p class="small">Modelos anunciados para tarefas complexas, programação e fluxos com agentes.</p>`,`Os fabricantes publicaram anúncios em novembro de 2026. Não declarar superioridade geral nem confundir anúncios com acesso universal. Pergunta: como verificar um código gerado? Testes, revisão, segurança e requisitos.`,[S.openai,S.gemini]),
slide('Desafio de lógica','02 / Experimento',`<h2>O código funciona?</h2><div class="split"><div style="background:#181d18;padding:30px;border-left:4px solid var(--accent);font:36px/1.6 monospace;white-space:pre">nota = 6\nif nota &gt; 6:\n    print("Aprovado")\nelse:\n    print("Revisão")</div><div><p class="question">Qual será a saída?</p><div class="tabrow"><button data-logic="Aprovado">Aprovado</button><button data-logic="Revisão">Revisão</button></div><p class="statusline" id="logicResult" aria-live="polite"></p></div></div>`,`Exemplo didático fictício, não regra de aprovação da escola. A expressão 6 > 6 é falsa. Para incluir 6 na primeira condição, usar >=.`,[]),
slide('Artemis II','03 / Espaço',`<div class="fullphoto photo"><img data-src="${esc(media.moon[0])}" alt="A Terra surgindo atrás do horizonte lunar, fotografia da missão Artemis II"><div class="fallback"><div class="big">Lua.</div><a href="${media.moon[2]}" target="_blank" rel="noopener">Abrir fotografia original</a></div></div><div class="overlay"><div class="eyebrow">NASA / ESA · abril de 2026</div><h2>A Terra vista da Lua.</h2><p class="sub">Artemis II · 4 astronautas · sobrevoo lunar</p><p class="small" style="margin-top:12px">Imagem: ESA/NASA · Earthset</p></div>`,`Artemis II partiu em 01/04 e retornou em 10/04/2026. Foi um sobrevoo tripulado, não um pouso lunar. A fotografia mostra a Terra no horizonte lunar.`,[S.moon,S.moonRecap,media.moon[2]]),
slide('Vídeo Artemis II','03 / Vídeo',`<h2 style="font-size:49px">De volta à Terra.</h2>${video('AYSE6QLigik','Welcome Home, Artemis II — NASA')}`,`Recapitulação oficial da NASA. Legendas e autorização de incorporação não testadas. Selecione um trecho curto antes da aula.`,['https://www.youtube.com/watch?v=AYSE6QLigik',S.moonRecap]),
slide('Artemis: próximos passos','03 / Espaço',`<h2>O que vem depois?</h2><div class="timeline"><article><div class="num">2026</div><h3>Artemis II</h3><p>Sobrevoo lunar realizado.</p></article><article><div class="num">2027</div><h3>Artemis III</h3><p>Testes em órbita terrestre planejados.</p></article><article><div class="num">2028</div><h3>Artemis IV</h3><p>Pouso lunar planejado.</p></article></div><p class="sub">As próximas missões são planos, não fatos consumados.</p>`,`Cronograma atualizado pela NASA em 04/11/2026; sujeito a alterações. Artemis III inclui operações de encontro e acoplamento em órbita terrestre.`,[S.artemis]),
slide('Starship','03 / Espaço',`<div class="split"><div><h2>Um foguete que pode voltar.</h2><p class="sub">SpaceX · Starship</p><p class="captioned">Sensores, controle de voo e telemetria.</p></div>${photo('rocket','Lançamento do Starship Flight 5, em 2024')}</div>`,`Foto histórica de 2024, não do voo 15. A página oficial descreve preparação e objetivos do voo 15; não usamos alegações de resultado sem confirmação adicional. Discuta reuso e confiabilidade de software.`,[S.spacex,media.rocket[2]]),
slide('Starlink','03 / Experimento',`<h2>Do celular ao satélite.</h2><div class="split"><div class="orbit"><svg viewBox="0 0 500 360" role="img" aria-label="Simulação de ligação entre celular, satélite e rede terrestre"><path d="M0 340Q250 130 500 340V360H0Z" fill="#273f35" stroke="#7dbb93" stroke-width="3"/><path d="M45 110Q250 -10 455 110" fill="none" stroke="#778078" stroke-dasharray="8 8"/><g id="sat" transform="translate(250 75)"><rect x="-78" y="-12" width="54" height="24" fill="#5b83a4"/><rect x="24" y="-12" width="54" height="24" fill="#5b83a4"/><rect x="-22" y="-21" width="44" height="42" fill="#c5c7c1"/></g><path id="signal" d="M100 258L250 75L400 258" stroke="#b7e875" stroke-width="4" fill="none" stroke-dasharray="12 8"/><rect x="82" y="240" width="34" height="57" rx="5" fill="#151815" stroke="#fff" stroke-width="2"/><path d="M380 294L400 240L420 294M385 280H415" stroke="#fff" stroke-width="3" fill="none"/><text x="99" y="325" text-anchor="middle" fill="#fff" font-size="23">Celular</text><text x="400" y="325" text-anchor="middle" fill="#fff" font-size="23">Rede</text></svg></div><div><div class="num" id="satStatus" style="font-size:64px">Conectado</div><p class="sub">Mova o satélite para observar a cobertura simulada.</p><div class="ctrl"><input id="satRange" type="range" min="0" max="100" value="50" aria-label="Posição do satélite"></div><p class="small">Modelo simplificado, sem dados orbitais reais.</p></div></div>`,`Direct to Cell usa satélites compatíveis com redes móveis de operadoras parceiras. A cobertura real depende de geometria, tecnologia, espectro, autorização, aparelho e serviço. O limiar do simulador é ilustrativo.`,[S.starlink]),
slide('Robôs humanoides','04 / Robótica',`<div class="split"><div><h2>O robô precisa enxergar.</h2><p class="sub">Tesla Optimus</p><p class="captioned">Percepção → decisão → movimento</p></div>${photo('robot','Robô humanoide Tesla Optimus')}</div>`,`A Tesla apresenta Optimus como projeto de robô de uso geral. Não afirmar que já realiza qualquer tarefa doméstica ou opera sem supervisão em todos os cenários. A demonstração seguinte é uma analogia.`,[S.tesla,media.robot[2]]),
slide('Visão computacional','04 / Experimento',`<h2>O que o sistema detecta?</h2><div class="split"><div class="road"><svg viewBox="0 0 500 340" role="img" aria-label="Pista didática e obstáculo"><rect width="500" height="340" fill="#1e2722"/><path d="M150 0H350L495 340H5Z" fill="#4b4f4b"/><path d="M250 0V340" stroke="#deded7" stroke-width="4" stroke-dasharray="22 18"/><g id="obstacle" transform="translate(250 130)"><rect x="-40" y="-35" width="80" height="70" fill="#c6a17e"/><rect x="-50" y="-45" width="100" height="90" stroke="#b7e875" stroke-width="4" fill="none"/><text x="-48" y="-53" fill="#e9f7c9" font-size="20">OBSTÁCULO</text></g><rect x="205" y="260" width="90" height="65" rx="12" fill="#cad0c9"/><path d="M250 260L190 150H310Z" fill="#b7e875" opacity=".12"/></svg></div><div><div class="num" id="roadStatus" style="font-size:60px">Detectado</div><p class="sub">Desloque o objeto para dentro ou fora da área de detecção.</p><div class="ctrl"><input id="roadRange" type="range" min="0" max="100" value="50" aria-label="Posição horizontal do obstáculo"></div><p class="small">Regra geométrica simulada, sem câmera ou IA real.</p></div></div>`,`O exemplo usa uma regra de posição para representar detecção. Sistemas reais combinam sensores, modelos, estimativas e planejamento. FSD (Supervised) da Tesla exige supervisão; não usar como instrução de direção.`,[S.fsd]),
slide('Computação quântica','05 / Computação',`<div class="split"><div><h2>105 qubits.</h2><p class="sub">Google Willow</p><p class="captioned">Uma arquitetura diferente de CPU e GPU.</p></div>${photo('quantum','Chip quântico Willow, Google')}</div>`,`Willow foi apresentado em 2024. Qubits não tornam todo programa automaticamente mais rápido. Superposição, interferência e medição são conceitos centrais; certos algoritmos exploram esses efeitos.`,[S.willow,media.quantum[2]]),
slide('Qubit','05 / Experimento',`<h2>O que sai na medição?</h2><div class="split"><div class="quantum"><svg viewBox="0 0 400 340" role="img" aria-label="Esfera de Bloch simplificada"><circle cx="200" cy="170" r="132" fill="#1b231b" stroke="#a4b5a0" stroke-width="2"/><ellipse cx="200" cy="170" rx="132" ry="35" fill="none" stroke="#81917d" stroke-dasharray="7 7"/><path d="M200 30V310M55 170H345" stroke="#81917d"/><path id="qVector" d="M200 170L320 170" stroke="#b7e875" stroke-width="6"/><circle cx="200" cy="170" r="5" fill="#fff"/><text x="215" y="25" fill="#fff" font-size="24">|0⟩</text><text x="215" y="330" fill="#fff" font-size="24">|1⟩</text></svg></div><div><div class="metric"><span>Chance de medir 1</span><b id="qProb">50%</b></div><input type="range" id="qRange" min="0" max="100" step="5" value="50" aria-label="Probabilidade de medir um"><div class="tabrow"><button id="measure">Medir</button><button id="qReset">Zerar</button></div><div class="metric"><span>0: <b id="zeros">0</b> &nbsp; 1: <b id="ones">0</b></span><b id="qLast">—</b></div><p class="small">Sorteio clássico de probabilidades.</p></div></div>`,`A esfera representa uma família de estados com fase fixa. A chance de 1 é ajustada; o botão sorteia resultados clássicos para ilustrar medições em cópias preparadas do mesmo estado. Não é um simulador quântico completo; não demonstra interferência.`,[]),
slide('IBM: o próximo passo','05 / Computação',`<h2>1.040 qubits?</h2><div class="split"><div><div class="big">2027</div><p class="sub">Meta anunciada pela IBM</p></div><div><div class="num">520 + 520</div><p class="sub">Dois processadores Nighthawk r3 conectados.</p></div></div><p class="small">Plano anunciado em novembro de 2026. Não é uma máquina entregue.</p>`,`IBM publicou em novembro de 2026 o plano de conectar dois Nighthawk r3 em 2027. Quantidade de qubits físicos não equivale à quantidade de qubits lógicos confiáveis.`,[S.ibm]),
slide('Agenda 2027','06 / Eventos',`<h2>O que acompanhar em 2027.</h2><div class="timeline"><article><div class="num" style="font-size:64px">JAN</div><h3>CES</h3><p>6–9 janeiro<br>Eletrônicos e robótica.</p></article><article><div class="num" style="font-size:64px">MAR</div><h3>GTC</h3><p>Março<br>GPUs, computação e IA.</p></article><article><div class="num" style="font-size:64px">2027</div><h3>Artemis III</h3><p>Missão planejada.<br>Acompanhe a NASA.</p></article></div><p class="small" style="margin-top:25px">Calendário consultado em 26/11/2026 · sujeito a alterações.</p>`,`CES: 6–9 janeiro, fonte oficial. GTC: páginas oficiais consultadas divergem entre 14–18 e 15–18 de março; mantemos apenas o mês. Artemis III não é evento de inscrição estudantil.`,[S.ces,S.gtc,'https://www.nvidia.com/gtc/events/',S.artemis]),
slide('Oportunidades estudantis','06 / Eventos',`<h2>Onde vocês podem participar?</h2><div class="timeline"><article><h3>OBI</h3><p>Algoritmos e programação.</p></article><article><h3>FEBRACE</h3><p>Projetos científicos e tecnológicos.</p></article><article><h3>Space Apps</h3><p>Desafios com dados da NASA.</p></article></div><p class="sub">Acompanhar editais, regras de idade e inscrições de 2027.</p>`,`Não afirmar que inscrições 2027 estão abertas. Consulte os organizadores e verifique requisitos, idade, participação escolar, custos e prazos.`,[S.obi,S.febrace,S.nasaApps]),
slide('Tech Quiz','07 / Desafio',`<div class="quizbar"><div class="eyebrow" id="quizCounter" style="margin:0">Questão 1</div><div class="small" id="quizScore">0 acertos</div><button id="quizReset">Reiniciar</button></div><h2 class="question" id="quizQuestion" style="margin-top:20px"></h2><div class="choices" id="quizChoices"></div><div class="feedback" id="quizFeedback" aria-live="polite"></div><div class="quizbar"><span class="small">Resposta coletiva · sem nota</span><button id="quizNext" disabled>Próxima questão →</button></div>`,`Quiz de 8 questões. Use votação oral e peça a um representante que toque na alternativa. Sem coleta de nome ou nota. Reinicie para uma nova turma.`,[]),
slide('Encerramento','08 / Discussão',`<div style="margin:auto 0"><div class="eyebrow">Pergunta final</div><h2 style="font-size:86px;max-width:1100px">Qual dessas tecnologias você gostaria de aprender a programar?</h2><p class="sub">Robôs · IA · games · satélites · sistemas</p></div>`,`Convide os alunos a escolher um tema e explicar por quê. Relacione à lógica, APIs, interfaces, segurança e empreendedorismo.`,[])
];

const view3d=(kind,label,interactive=true)=>`<div class="three-stage" data-model="${kind}"><canvas aria-label="${label}" role="img" tabindex="0"></canvas>${interactive?`<div class="three-tools"><span class="hint3d">Gire com o dedo · pinça para ampliar<br>Ilustração 3D didática</span><button data-zoom="-1" aria-label="Reduzir zoom">−</button><button data-zoom="1" aria-label="Aumentar zoom">+</button><button class="reset3d" data-reset3d>Repor</button></div>`:`<div class="three-tools"><span class="hint3d">Ilustração técnica</span></div>`}</div>`;
slides[0].body=`<div class="cover-grid"><div><div class="year">AGV / NOV 2026</div><h1>TECH<br>NEWS<span style="color:var(--accent)">.</span></h1><div class="line"></div><p class="issue">Hardware, IA, espaço,<br>robótica e computação quântica.</p><p class="cover-foot">Desenvolvimento de Sistemas · 2026/27</p></div><div class="art">${view3d('chip','Ilustração tridimensional de um processador',false)}</div></div>`;
slides[1].body=`<div class="scene-grid"><div class="hero-copy"><h2>Um computador de IA de</h2><div class="big">15 cm.</div><p class="sub">NVIDIA DGX Spark</p><p class="spark-dims">150 × 150 × 50,5 mm</p><button class="media-toggle" data-media-toggle="spark">Ver foto do produto</button></div><div id="sparkVisual" class="media-layer">${view3d('spark','Modelo geométrico dimensional do DGX Spark')}<div class="media-layer" data-media="spark" hidden>${photo('spark','NVIDIA DGX Spark em vista de produto',sparkArt)}</div></div></div>`;
slides[1].note+=' O modelo 3D é uma reconstrução geométrica didática das dimensões externas, não um CAD oficial ou fotografia. Detalhes de acabamento são ilustrativos.';
slides[2].body=`<h2>O que cabe nessa caixa?</h2><div class="stat-row"><div><div class="hero-stat">128 GB</div><p>Memória unificada</p><p class="small" style="font-size:22px;margin-top:12px">Configuração de referência</p></div><div><div class="hero-stat">1 PFLOP</div><p>Processamento de IA</p><p class="small" style="font-size:22px;margin-top:12px">Pico FP4 com esparsidade</p></div></div><p class="stat-foot">GB10 Grace Blackwell · 150 × 150 × 50,5 mm</p>`;

const defaults={chip:{yaw:-.59,pitch:.64,zoom:1},spark:{yaw:-.63,pitch:.52,zoom:1.16},gpu:{yaw:-.18,pitch:.70,zoom:1.20},moon:{yaw:-.20,pitch:.17,zoom:1},rocket:{yaw:-.55,pitch:.05,zoom:1},sat:{yaw:-.13,pitch:.11,zoom:1},qubit:{yaw:-.40,pitch:.17,zoom:1}};
let glRenderer=null;
function initGL(){try{const cv=document.createElement('canvas'),gl=cv.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:true,premultipliedAlpha:false});if(!gl)return null;

function drawGL(obj,ctx,w,h,scale,rot,factor){if(!glRenderer||glRenderer.gl.isContextLost())return false;try{const {cv,gl,pr,buffer,pa,ca}=glRenderer;const ww=Math.round(w*scale),hh=Math.round(h*scale);if(cv.width!==ww||cv.height!==hh){cv.width=ww;cv.height=hh}gl.viewport(0,0,ww,hh);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(pr);const data=[];for(const f of obj.mesh.faces){let p=f.p.map(rot);let v1=p[1].map((a,i)=>a-p[0][i]),v2=p[2].map((a,i)=>a-p[0][i]);let n=[v1[1]*v2[2]-v1[2]*v2[1],v1[2]*v2[0]-v1[0]*v2[2],v1[0]*v2[1]-v1[1]*v2[0]];let norm=Math.hypot(...n)||1;let diffuse=Math.abs((n[0]*-.35+n[1]*.75+n[2]*.52)/norm);let light=f.shade*(.83+.21*diffuse);let hval=parseInt(f.c.slice(1),16);let rgb=[(hval>>16)&255,(hval>>8)&255,hval&255].map(v=>clamp(v*light/255,0,1));for(let j=1;j<p.length-1;j++)for(const [x,y,z] of [p[0],p[j],p[j+1]])data.push(x*factor*2/w,y*factor*2/h,-z/12,1-z/12,...rgb)}gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(pa);gl.enableVertexAttribArray(ca);gl.vertexAttribPointer(pa,4,gl.FLOAT,false,28,0);gl.vertexAttribPointer(ca,3,gl.FLOAT,false,28,16);gl.drawArrays(gl.TRIANGLES,0,data.length/7);ctx.drawImage(cv,0,0,w,h);return true}catch{return false}}
glRenderer=initGL();document.documentElement.dataset.renderer=glRenderer?'webgl':'canvas-zbuffer';

const rasterCanvas=document.createElement('canvas'),rasterCtx=rasterCanvas.getContext('2d');let rasterDepth=null;
function drawSoftware(obj,ctx,w,h,project){if(!rasterCtx)return false;const scale=Math.min(1.2,800/w,600/h);const rw=Math.max(1,Math.round(w*scale)),rh=Math.max(1,Math.round(h*scale));if(rasterCanvas.width!==rw||rasterCanvas.height!==rh){rasterCanvas.width=rw;rasterCanvas.height=rh;rasterDepth=new Float32Array(rw*rh)}if(!rasterDepth)rasterDepth=new Float32Array(rw*rh);rasterDepth.fill(-Infinity);const image=rasterCtx.createImageData(rw,rh),pix=image.data;
 const tri=(a,b,c,r,g,bl)=>{const ax=a[0]*scale,ay=a[1]*scale,bx=b[0]*scale,by=b[1]*scale,cx=c[0]*scale,cy=c[1]*scale;let det=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);if(Math.abs(det)<.0001)return;const x0=Math.max(0,Math.floor(Math.min(ax,bx,cx))),x1=Math.min(rw-1,Math.ceil(Math.max(ax,bx,cx))),y0=Math.max(0,Math.floor(Math.min(ay,by,cy))),y1=Math.min(rh-1,Math.ceil(Math.max(ay,by,cy)));for(let y=y0;y<=y1;y++){const py=y+.5;for(let x=x0;x<=x1;x++){const px=x+.5,wa=((by-cy)*(px-cx)+(cx-bx)*(py-cy))/det,wb=((cy-ay)*(px-cx)+(ax-cx)*(py-cy))/det,wc=1-wa-wb;if(wa<-.00001||wb<-.00001||wc<-.00001)continue;const z=wa*a[2]+wb*b[2]+wc*c[2],i=y*rw+x;if(z>=rasterDepth[i]){rasterDepth[i]=z;const k=i*4;pix[k]=r;pix[k+1]=g;pix[k+2]=bl;pix[k+3]=255}}}};
 for(const f of obj.mesh.faces){const p=f.p.map(project),n=parseInt(f.c.slice(1),16),r=clamp(Math.round(((n>>16)&255)*f.shade),0,255),g=clamp(Math.round(((n>>8)&255)*f.shade),0,255),bl=clamp(Math.round((n&255)*f.shade),0,255);for(let i=1;i<p.length-1;i++)tri(p[0],p[i],p[i+1],r,g,bl)}rasterCtx.putImageData(image,0,0);ctx.drawImage(rasterCanvas,0,0,w,h);return true}

function draw(obj){if(!obj.el.closest('.slide.active')||obj.el.hidden)return;const c=obj.canvas,r=c.getBoundingClientRect();if(!r.width||!r.height)return;const w=c.clientWidth,h=c.clientHeight,scale=Math.min(1.65,Math.max(1,devicePixelRatio||1));if(c.width!==Math.round(w*scale)||c.height!==Math.round(h*scale)){c.width=Math.round(w*scale);c.height=Math.round(h*scale)}const ctx=obj.ctx;ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,w,h);
 const {yaw,pitch,zoom}=obj,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),factor=Math.min(w/7.4,h/5.4)*zoom;
 const rot=p=>{const [x,y,z]=p;let a=cy*x+sy*z,b=-sy*x+cy*z;return [a,cp*y-sp*b,sp*y+cp*b]};const project=p=>{let [x,y,z]=rot(p),persp=12/(12-z);return [w*.5+x*factor*persp,h*.5-y*factor*persp,z]};
 let glow=ctx.createRadialGradient(w*.5,h*.51,0,w*.5,h*.51,Math.min(w,h)*.54);glow.addColorStop(0,obj.kind==='qubit'?'#383054':obj.kind==='moon'||obj.kind==='sat'?'#203c54':'#273c31');glow.addColorStop(1,'#0b0d1000');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 if(['spark','gpu','chip','rocket'].includes(obj.kind)){let shadow=ctx.createRadialGradient(w/2,h*.78,0,w/2,h*.78,w*.34);shadow.addColorStop(0,'#000000b5');shadow.addColorStop(1,'#00000000');ctx.save();ctx.translate(w/2,h*.78);ctx.scale(1,.25);ctx.translate(-w/2,-h*.78);ctx.fillStyle=shadow;ctx.fillRect(0,0,w,h*2);ctx.restore()}
 const m=obj.mesh;if(!drawGL(obj,ctx,w,h,scale,rot,factor)&&!drawSoftware(obj,ctx,w,h,project)){const sorted=m.faces.map(f=>{let p=f.p.map(project);return {...f,p,z:p.reduce((a,b)=>a+b[2],0)/p.length}}).sort((a,b)=>a.z-b.z);for(const f of sorted){ctx.beginPath();f.p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color(f.c,f.shade);ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.5;ctx.stroke()}}
 for(const l of m.lines){ctx.beginPath();l.p.map(project).forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle=l.c;ctx.lineWidth=l.width;ctx.setLineDash(l.dash?[7,6]:[]);ctx.stroke()}ctx.setLineDash([]);ctx.font='600 21px Arial';ctx.textAlign='center';ctx.textBaseline='middle';for(const l of m.labels){let [x,y]=project(l.p);ctx.fillStyle=l.c;ctx.fillText(l.text,x,y)}
}
function reset(o){Object.assign(o,defaults[o.kind]);draw(o)}
function zoom(o,z){o.zoom=clamp(z,.65,1.65);draw(o)}
function setup(el){let canvas=el.querySelector('canvas'),ctx=canvas.getContext('2d');if(!ctx){el.classList.add('failed');el.parentElement.querySelector('.legacy-graphic')?.classList.add('fallback-show');return}const kind=el.dataset.model,o={el,canvas,ctx,kind,mesh:build(kind),...defaults[kind],pointers:new Map()};models.set(kind,o);let lastPinch=null;
 const points=()=>[...o.pointers.values()];const distance=()=>{let p=points();return p.length===2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0};
 canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);o.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastPinch=distance()||null});canvas.addEventListener('pointermove',e=>{if(!o.pointers.has(e.pointerId))return;let old=o.pointers.get(e.pointerId);o.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(o.pointers.size===1){const k=canvas.getBoundingClientRect().width/canvas.clientWidth||1;o.yaw+=(e.clientX-old.x)*.009/k;o.pitch=clamp(o.pitch+(e.clientY-old.y)*.009/k,-1.4,1.4);draw(o)}else if(o.pointers.size===2){let d=distance();if(lastPinch&&d>0)zoom(o,o.zoom*d/lastPinch);lastPinch=d}});const end=e=>{o.pointers.delete(e.pointerId);lastPinch=distance()||null};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(o,o.zoom*Math.exp(-e.deltaY*.001))},{passive:false});canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','0'].includes(e.key)){e.stopPropagation();e.preventDefault();if(e.key==='ArrowLeft')o.yaw-=.15;if(e.key==='ArrowRight')o.yaw+=.15;if(e.key==='ArrowUp')o.pitch=clamp(o.pitch-.15,-1.4,1.4);if(e.key==='ArrowDown')o.pitch=clamp(o.pitch+.15,-1.4,1.4);if(e.key==='+')zoom(o,o.zoom*1.12);if(e.key==='-')zoom(o,o.zoom/1.12);if(e.key==='0')reset(o);draw(o)}});el.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoom(o,o.zoom*(b.dataset.zoom==='1'?1.15:1/1.15)));el.querySelector('[data-reset3d]')?.addEventListener('click',()=>reset(o));
}
document.querySelectorAll('.three-stage').forEach(setup);window.drawActive3D=()=>{for(const o of models.values())draw(o)};window.drawActive3D();addEventListener('resize',()=>requestAnimationFrame(window.drawActive3D));
$('slides').addEventListener('click',e=>{let b=e.target.closest('[data-gpu]');if(b){gpuIndex=+b.dataset.gpu;let d=gpu[gpuIndex];['gpuName','gpuGen','gpuCores','gpuVRAM','gpuMem'].forEach((id,i)=>$(id).textContent=d[i]);document.querySelectorAll('[data-gpu]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));let o=models.get('gpu');if(o){o.mesh=build('gpu');draw(o)}}let t=e.target.closest('[data-media-toggle]');if(t){let key=t.dataset.mediaToggle,panel=document.querySelector(`[data-media="${key}"]`);let show=panel.hidden;panel.hidden=!show;panel.querySelectorAll('img[data-src]').forEach(loadImage);if(key!=='gpu'){let canvas=panel.parentElement.querySelector('.three-stage');canvas.hidden=show;t.textContent=show?'Voltar ao modelo 3D':{spark:'Ver foto do produto',moon:'Ver fotografia da missão',rocket:'Ver foto de lançamento'}[key];if(!show)window.drawActive3D()}else if(!show){window.drawActive3D()}}});
