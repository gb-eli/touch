<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AGV TOUCH · Estúdio 3D</title><link rel="stylesheet" href="./viewer.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head>
<body><main class="shell"><header><a href="./index.html" class="back" aria-label="Voltar ao laboratório">‹</a><div class="brand">AGV<span>TOUCH</span><i>.</i><small>ESTÚDIO 3D</small></div><button id="full" type="button">Tela cheia</button></header>
<section class="workspace"><div class="stage"><div id="viewport" aria-label="Visualização tridimensional" tabindex="0"></div><div class="label"><span>MODELOS / 1.2</span><h1 id="title">Estúdio de materiais</h1><p id="status" role="status" aria-live="polite">Preparando renderização…</p></div><div class="tools"><button id="minus" aria-label="Afastar">−</button><button id="plus" aria-label="Aproximar">+</button><button id="rotate" aria-label="Rotação automática" aria-pressed="false">↻</button><button id="reset" aria-label="Restaurar câmera">⌂</button></div><div id="metric" class="metric"></div></div>
<aside><div class="eyebrow">CENA</div><h2>Modelo</h2><button id="sample" class="wide">Amostra PBR</button><label class="file">Abrir modelo GLB<input id="modelFile" type="file" accept=".glb"></label><p class="note">GLB 2.0 autocontido · até 16 MB. O arquivo não é enviado.</p><button id="animate" class="wide" aria-pressed="false" disabled>Animação</button>
<div class="section"><div class="eyebrow">ILUMINAÇÃO</div><h2>Ambiente</h2><div class="env"><button data-env="studio" aria-pressed="true">Estúdio</button><button data-env="warm" aria-pressed="false">Quente</button><button data-env="contrast" aria-pressed="false">Contraste</button></div><label class="file">Abrir panorama HDR<input id="hdrFile" type="file" accept=".hdr"></label><p class="note" id="envStatus">HDR procedural · luz de estúdio</p><label for="exposure">Exposição <output id="exposureValue">1,0</output></label><input id="exposure" type="range" min=".4" max="2" step=".1" value="1"></div>
<div class="section"><label for="quality">Qualidade</label><select id="quality"><option value="eco">Eco</option><option value="balanced" selected>Equilibrado</option><option value="ultra">Ultra</option></select></div><a class="credits" href="./models/CREDITS.md">Créditos e formatos</a></aside></section></main><script type="module" src="./viewer.mjs"></script></body></html>
